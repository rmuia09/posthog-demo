name: HogDesk Lite CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI backend
        working-directory: ./backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -sf http://localhost:8000/api/v1/health

      - name: Generate test events for PostHog
        working-directory: ./backend
        run: |
          curl -sf -X POST http://localhost:8000/api/v1/checkout \
            -H 'Content-Type: application/json' \
            -d '{"user_id":"ci_weekday_test","currency":"KES","amount":1500,"environment":"production"}'
          curl -sf -X POST http://localhost:8000/api/v1/tickets/route \
            -H 'Content-Type: application/json' \
            -d '{"user_id":"ci_weekday_test","category":"billing","description":"CI generated event for weekday analysis","priority":"normal"}'

      - name: Run behave BDD tests
        working-directory: ./backend/tests
        run: behave

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20 (required by Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Set up Python (for FastAPI backend)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Create frontend .env from secret
        working-directory: ./frontend
        run: |
          echo "VITE_POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}" > .env
          echo "VITE_POSTHOG_HOST=https://us.i.posthog.com" >> .env

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI backend
        working-directory: ./backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -sf http://localhost:8000/api/v1/health

      - name: Start frontend dev server (for Playwright webServer reuse)
        working-directory: ./frontend
        run: |
          npm run dev &
          sleep 5
          curl -sf http://localhost:5173/

      - name: Run Playwright E2E tests
        working-directory: ./frontend
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: https://us.i.posthog.com
        run: npx playwright test
